baseURL = "https://www.greenbladesec.com/"
languageCode = "en-us"
title = "GP Singh"
enableRobotsTXT = true
enableEmoji = true

# ── THEME SWITCH ─────────────────────────────────────────────
# Change this one line to swap themes:
#   theme = "terminal"   ← kali-style terminal hacker
#   theme = "premium"    ← minimalist premium cyberpunk
theme = "premium"

[params]
  author       = "GP Singh"
  handle       = "pyhacksecgp"
  role         = "Cybersecurity Engineer"
  location     = "Vancouver, BC"
  description  = "Building agentic security tools. Long-term target: CISO."
  github       = "https://github.com/PyHackSecGP"
  linkedin     = "https://linkedin.com/in/gurpreet-singh-cyber"
  email        = "github.com/PyHackSecGP"

# terminal theme menu (kali-prompt style)
[menu]
  [[menu.main]]
    name       = "~/whoami"
    url        = "/"
    weight     = 1
  [[menu.main]]
    name       = "~/projects"
    url        = "/projects/"
    weight     = 2
  [[menu.main]]
    name       = "~/blog"
    url        = "/blog/"
    weight     = 3
  [[menu.main]]
    name       = "~/cv"
    url        = "/cv/"
    weight     = 4

# premium theme menu (clean)
  [[menu.premium]]
    name       = "About"
    url        = "/#about"
    weight     = 1
  [[menu.premium]]
    name       = "Projects"
    url        = "/projects/"
    weight     = 2
  [[menu.premium]]
    name       = "Homelab"
    url        = "/#homelab"
    weight     = 3
  [[menu.premium]]
    name       = "Blog"
    url        = "/blog/"
    weight     = 4
  [[menu.premium]]
    name       = "CV"
    url        = "/cv/"
    weight     = 5
  [[menu.premium]]
    name       = "Contact"
    url        = "/#contact"
    weight     = 6

[markup]
  [markup.highlight]
    style            = "github-dark"
    lineNos          = false
    codeFences       = true
  [markup.goldmark.renderer]
    unsafe           = true
